<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>投资研报 | GARCH Quant</title>
<style>
:root{--主深蓝:#0a2463;--哑光金:#c9a961;--正文色:#222222;--浅边框:#e5e7eb;--背景白:#ffffff;}
[data-theme="dark"]{--主深蓝:#7398d4;--哑光金:#d4b878;--正文色:#eeeeee;--浅边框:#374151;--背景白:#111827;}
*{margin:0;padding:0;box-sizing:border-box;transition:background-color 0.3s ease,color 0.3s ease;}
body{font-family:Georgia,"Times New Roman",serif;background-color:var(--背景白);color:var(--正文色);line-height:1.85;}
button{position:fixed;top:18px;right:18px;padding:7px 14px;border:1px solid var(--浅边框);border-radius:6px;background:transparent;color:var(--主深蓝);cursor:pointer;font-size:14px;z-index:999;}
header{text-align:center;padding:60px 24px 40px;}
h1{font-size:2.2em;color:var(--主深蓝);margin-bottom:16px;letter-spacing:-0.02em;}
.subtitle{font-size:1.1em;color:var(--正文色);opacity:0.7;max-width:600px;margin:0 auto 40px;}
.cards{display:grid;max-width:860px;margin:0 auto;padding:0 24px 60px;gap:20px;}
.card{padding:28px 32px;border:1px solid var(--浅边框);border-radius:10px;background:var(--背景白);transition:transform 0.2s,box-shadow 0.2s;}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(10,36,99,0.12);}
.card h2{font-size:1.3em;color:var(--主深蓝);margin-bottom:10px;}
.card p{font-size:0.95em;opacity:0.75;margin-bottom:14px;}
.tags{display:flex;flex-wrap:wrap;gap:8px;}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;background:rgba(10,36,99,0.08);color:var(--主深蓝);font-size:0.8em;font-family:sans-serif;}
.card a{text-decoration:none;color:inherit;}
footer{text-align:center;padding:40px 24px;font-size:0.85em;opacity:0.5;}
@media(max-width:600px){.cards{padding:0 16px 40px;}.card{padding:20px;}}
</style>
</head>
<body>
<button onclick="document.documentElement.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')">深色模式</button>
<header>
  <h1>投资研报</h1>
  <p class="subtitle">GARCH Quant 机构研究 — 波动率建模、宏观研判与量化信号精选</p>
</header>
<div class="cards">
  <a href="./rklb.html" class="card">
    <h2>🚀 Rocket Lab (RKLB) 完整投资研报</h2>
    <p>高弹性成长股框架：四条主线监测、价位决策表、仓位管理与情景分析</p>
    <div class="tags">
      <span class="tag">成长验证</span><span class="tag">Neutron 催化</span><span class="tag">价位执行</span><span class="tag">仓位纪律</span>
    </div>
  </a>
  <a href="./ai-inflection.html" class="card">
    <h2>🤖 AI 产业投资转折点</h2>
    <p>从训练算力到电力、内存、互连与安全 — 四大主线雷达与交易员结论</p>
    <div class="tags">
      <span class="tag">电力与液冷</span><span class="tag">HBM/DRAM</span><span class="tag">光互连</span><span class="tag">AI 安全</span>
    </div>
  </a>
</div>
<footer>© GARCH Quant · 仅供学术研究参考，不构成投资建议</footer>
</body>
</html>
