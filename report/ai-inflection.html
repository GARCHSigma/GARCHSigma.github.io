        const mispricing = d.mispricing.map(x => '<li>' + escapeHtml(x) + '</li>').join('');
        const catalyst = d.catalyst.map(x => '<li>' + escapeHtml(x) + '</li>').join('');
        return '<article class="card opportunity"><div class="opportunity-head"><div><div class="eyebrow">Opportunity ' + String(idx+1).padStart(2,'0') + '</div><h3>' + escapeHtml(d.title) + '</h3></div><div class="tag-row"><span class="pill primary">' + escapeHtml(d.stance) + '</span><span class="pill">' + escapeHtml(d.market) + '</span><span class="pill mono">' + escapeHtml(d.ticker) + '</span></div></div><div class="split"><div class="note"><strong>核心逻辑</strong><p>' + escapeHtml(d.coreLogic) + '</p></div><div class="note"><strong>产业链位置</strong><p>' + escapeHtml(d.chain) + '</p></div></div><div class="split"><div class="note"><strong>需求扩大原因</strong><p>' + escapeHtml(d.reason) + '</p></div><div class="note"><strong>市场未定价证据</strong><ul>' + mispricing + '</ul></div></div><div class="split"><div class="note"><strong>数据证据</strong><ul>' + evidence + '</ul></div><div class="note"><strong>催化剂</strong><ul>' + catalyst + '</ul></div></div><div class="split"><div class="note"><strong>上行空间</strong><p>' + escapeHtml(d.upside) + '</p></div><div class="note"><strong>下行风险</strong><p>' + escapeHtml(d.downside) + '</p></div></div><div class="split"><div class="note"><strong>失效条件</strong><p>' + escapeHtml(d.invalidation) + '</p></div><div class="note"><strong>仓位建议 / 对冲方式</strong><p>' + escapeHtml(d.sizing) + ' ' + escapeHtml(d.hedge) + '</p></div></div></article>';
      }).join('');
      return '<section class="section" id="deep-dives"><div class="section-head"><div><h2>Top 机会深挖</h2><p>这里是正式研报主体。换主题时，保持结构不变，只替换数据与段落内容即可。</p></div></div>' + cards + '</section>';
    }

    function renderSimpleTableSection(id, title, desc, columns, rows) {
      const head = columns.map(c => '<th>' + escapeHtml(c) + '</th>').join('');
      const body = rows.map(row => '<tr>' + row.map(cell => '<td>' + cell + '</td>').join('') + '</tr>').join('');
      return '<section class="section" id="' + id + '"><div class="section-head"><div><h2>' + escapeHtml(title) + '</h2><p>' + escapeHtml(desc) + '</p></div></div><div class="table-wrap card"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div></section>';
    }

    function renderLists() {
      const shortRows = REPORT_DATA.shorts.map(r => [r.asset, r.reason, r.path, r.timing, r.feasibility, r.risk].map(escapeHtml));
      const pairRows = REPORT_DATA.pairs.map(r => [r.structure, r.long, r.short, r.logic, r.catalyst, r.invalidation].map(escapeHtml));
      const watchRows = REPORT_DATA.watchlist.map(r => [r.theme, r.gap, r.trigger, r.data, r.assets].map(escapeHtml));
      const gaps = REPORT_DATA.gaps.map(x => '<li>' + escapeHtml(x) + '</li>').join('');
      const trader = REPORT_DATA.traderSummary.map(x => '<li>' + escapeHtml(x) + '</li>').join('');
      const sources = REPORT_DATA.sources.map(x => '<li>' + escapeHtml(x) + '</li>').join('');
      return renderSimpleTableSection('shorts','做空或受损资产','用于明确哪些资产位于利润池外侧，适合作为空头腿或规避对象。',['受损资产','受损原因','替代路径','何时开始反映','做空可行性','风险'],shortRows) +
        renderSimpleTableSection('pairs','配对交易和跨市场传导','把一阶利润池与二阶传导链拆开，形成更干净的交易表达。',['交易结构','做多','做空','核心逻辑','催化剂','失效条件'],pairRows) +
        renderSimpleTableSection('watchlist','观察名单','现在不一定能买，但可能演变为未来高胜率机会。',['主题','当前缺什么证据','触发买入的信号','需要跟踪的数据','可能标的'],watchRows) +
        '<section class="section" id="data-gaps"><div class="section-head"><div><h2>数据缺口</h2><p>正式网页版需要把推测与已验证信息严格区分开，这里是模板中的固定位置。</p></div></div><article class="card card-pad"><ul class="bullet-list">' + gaps + '</ul></article></section>' +
        '<section class="section" id="trader-summary"><div class="section-head"><div><h2>交易员版本结论</h2><p>这部分可被直接复制到晨会稿、盘前要点或风控更新里。</p></div></div><article class="card card-pad"><ol class="stack" style="padding-left:1.25rem;">' + trader + '</ol></article></section>' +
        '<section class="section" id="template-notes"><div class="section-head"><div><h2>模板说明</h2><p>保留这部分，便于你或团队以后复用并快速改成别的行业主题。</p></div></div><div class="grid-2"><article class="card card-pad stack"><div class="note"><strong>如何复用</strong><p>只改 <span class="mono">REPORT_DATA</span> 即可复用；导航、图表、摘要、表格自动重绘。</p></div><div class="note"><strong>适合接入的数据</strong><p>股价表现、估值、盈利预测修正、期权 IV、拥挤度、估值分位数与引用脚注。</p></div><div class="note"><strong>适合接入的工作流</strong><p>Python / YAML 生成 JSON，再由静态站点模板直接读取并渲染。</p></div></article><article class="card card-pad stack"><div class="codebox mono">核心复用点：<br>1. REPORT_DATA.meta<br>2. REPORT_DATA.ranking / radar<br>3. REPORT_DATA.deepDives<br>4. REPORT_DATA.shorts / pairs / watchlist / gaps</div><div class="note"><strong>上线建议</strong><ul>' + sources + '</ul></div></article></div></section>';
    }

    function renderFooter() {
      return '<footer class="footer"><div>' + escapeHtml(REPORT_DATA.meta.brand) + ' · Reusable single-file institutional web report template.</div><div>Static HTML · responsive layout · dark/light mode · dashboard + long-form research in one page.</div></footer>';
    }

    function buildPage() {
      $('#metaDate').textContent = '更新日期 ' + REPORT_DATA.meta.date;
      $('#metaWindow').textContent = '时间窗 ' + REPORT_DATA.meta.window;
      content.innerHTML = [renderOverview(), renderCharts(), renderRankingTable(), renderRadarTable(), renderDeepDives(), renderLists(), renderFooter()].join('');
    }

    function makeCharts() {
      if (typeof Chart === 'undefined') return;
      const root = document.documentElement;
      const axis = getComputedStyle(root).getPropertyValue('--color-text-muted').trim();
      const grid = getComputedStyle(root).getPropertyValue('--color-border').trim();
      const primary = getComputedStyle(root).getPropertyValue('--color-primary').trim();
      Chart.defaults.font.family = 'Satoshi, ui-sans-serif, system-ui, sans-serif';
      Chart.defaults.color = axis;
      if (window.__gqRadar) window.__gqRadar.destroy();
      if (window.__gqBar) window.__gqBar.destroy();
      window.__gqRadar = new Chart($('#scoreRadar'), {
        type: 'radar',
        data: {
          labels: REPORT_DATA.ranking.map(x => x.theme.replace(/\s*\/\s*/g,'/')),
          datasets: [{label: '综合评分', data: REPORT_DATA.ranking.map(x => x.score), borderColor: primary, backgroundColor: primary + '33', pointBackgroundColor: primary, borderWidth: 2, pointRadius: 3, fill: true}]
        },
        options: {responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { r: { suggestedMin: 50, suggestedMax: 100, angleLines: { color: grid }, grid: { color: grid }, pointLabels: { color: axis, font: { size: 12, weight: '600' } }, ticks: { backdropColor: 'transparent', color: axis, stepSize: 10 } } }}
      });
      window.__gqBar = new Chart($('#rankBar'), {
        type: 'bar',
        data: {
          labels: REPORT_DATA.ranking.map(x => x.theme),
          datasets: [{label: '总分', data: REPORT_DATA.ranking.map(x => x.score), borderRadius: 10, backgroundColor: ['rgba(88,162,173,.9)','rgba(116,187,147,.9)','rgba(118,169,234,.9)','rgba(216,164,90,.9)','rgba(186,157,241,.9)']}]
        },
        options: {indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { min: 50, max: 100, grid: { color: grid }, ticks: { color: axis } }, y: { grid: { display: false }, ticks: { color: axis, font: { weight: '600' } } } }}
      });
    }

    function initTheme() {
      const root = document.documentElement;
      let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      root.setAttribute('data-theme', theme);
      const toggle = $('[data-theme-toggle]');
      const sync = () => { toggle.textContent = theme === 'dark' ? '浅色' : '深色'; toggle.setAttribute('aria-label', 'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' mode'); };
      sync();
      toggle.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', theme); sync(); makeCharts(); });
    }

    function initSearch() {
      const input = $('#searchInput');
      const blocks = $$('section, article.card', content);
      input.addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase();
        blocks.forEach(el => {
          if (!q) { el.style.opacity = ''; el.style.outline = ''; return; }
          const match = el.innerText.toLowerCase().includes(q);
          el.style.opacity = match ? '1' : '.45';
          el.style.outline = match ? '1px solid color-mix(in oklab, var(--color-primary) 45%, transparent)' : 'none';
        });
      });
    }

    function initActiveNav() {
      const links = $$('.nav-link');
      const sections = $$('.content section[id]');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            links.forEach(link => link.classList.toggle('active', link.getAttribute('href') === '#' + entry.target.id));
          }
        });
      }, { root: $('.content'), threshold: 0.35 });
      sections.forEach(s => observer.observe(s));
    }

    function init() { renderNav(); buildPage(); initTheme(); initSearch(); initActiveNav(); makeCharts(); }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
