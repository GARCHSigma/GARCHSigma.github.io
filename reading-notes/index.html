<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>读书笔记 | GARCHSigma</title>
<style>
:root{
    --主深蓝:#0a2463;
    --哑光金:#c9a961;
    --正文色:#222222;
    --浅边框:#e5e7eb;
    --背景白:#ffffff;
}
[data-theme="dark"]{
    --主深蓝:#7398d4;
    --哑光金:#d4b878;
    --正文色:#eeeeee;
    --浅边框:#374151;
    --背景白:#111827;
}
*{margin:0;padding:0;box-sizing:border-box;transition:background-color 0.3s ease,color 0.3s ease;}
body{
    max-width:820px;margin:0 auto;padding:60px 24px 40px;
    font-family:Georgia,"Times New Roman",serif;
    background-color:var(--背景白);color:var(--正文色);line-height:1.85;
}
.theme-switch{
    position:fixed;top:18px;right:18px;padding:7px 14px;
    border:1px solid var(--浅边框);border-radius:6px;
    background:transparent;color:var(--主深蓝);cursor:pointer;font-size:14px;
}
header{text-align:center;padding-bottom:28px;border-bottom:1px solid var(--浅边框);margin-bottom:50px;}
h1{font-size:36px;color:var(--主深蓝);margin-bottom:18px;font-weight:600;}
nav{display:flex;justify-content:center;gap:36px;flex-wrap:wrap;}
nav a{color:var(--主深蓝);text-decoration:none;font-size:17px;}
nav a:hover{color:var(--哑光金);}
nav a.nav-highlight{color:var(--哑光金);font-weight:600;border-bottom:2px solid var(--哑光金);}
nav a.nav-highlight:hover{color:var(--主深蓝);}
h2{font-size:24px;color:var(--主深蓝);margin:45px 0 16px;}
p{margin-bottom:18px;font-size:17px;}
.note-item{padding:16px 0;border-bottom:1px dashed var(--浅边框);}
.note-item a{color:var(--正文色);text-decoration:none;font-size:18px;}
.note-item a:hover{color:var(--哑光金);}
.note-meta{font-size:14px;color:#6b7280;margin-top:5px;}
.note-excerpt{font-size:15px;color:#6b7280;margin-top:6px;}
.back-link{display:inline-block;margin-bottom:20px;color:var(--主深蓝);text-decoration:none;font-size:15px;}
.back-link:hover{color:var(--哑光金);}
footer{margin-top:80px;padding-top:25px;border-top:1px solid var(--浅边框);font-size:14px;text-align:center;color:#6b7280;}
@media(max-width:600px){
    body{padding-top:70px;}
    nav{flex-direction:column;gap:10px;}
}
</style>
</head>
<body>
<button class="theme-switch" id="darkBtn">深色模式</button>

<header>
    <h1>读书笔记</h1>
    <nav>

        <a href="../index.html#领域">研究领域</a>
        <a href="../index.html#文章">研究文章</a>
        <a href="./index.html" class="nav-highlight">📖 读书笔记</a>
        <a href="https://lib.garch.space" target="_blank">🧰 量化工具箱</a>
        <a href="../index.html#引用">引用格式</a>
    </nav>
</header>

<section>
    <a href="../index.html" class="back-link">← 返回首页</a>
</section>

<section>
    <h2>笔记列表</h2>

    <div class="note-item">
        <a href="time-series-qf-notes.html">《时间序列分析在量化金融中的应用》阅读笔记</a>
        <div class="note-meta">2026年5月 · 时间序列分析</div>
        <div class="note-excerpt">结构、内容与可拓展方向——SSRN预印本综述的要点提炼。</div>
    </div>
</section>

<footer>

<script>
const btn = document.getElementById('darkBtn');
btn.addEventListener('click',()=>{
    if(document.documentElement.getAttribute('data-theme')==='dark'){
        document.documentElement.removeAttribute('data-theme');
        btn.innerText='深色模式';
    }else{
        document.documentElement.setAttribute('data-theme','dark');
        btn.innerText='浅色模式';
    }
})
</script>
</body>
</html>
